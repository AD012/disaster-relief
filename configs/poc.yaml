# Phase 4 proof-of-concept: replay ordered frames through detector -> NMS -> calibrated threshold -> box inflation.
run_name: poc-replay

detector:                 # frozen Phase 2 settings; adapter: path to LoRA dir or head state dict (Phase 5)
  model: IDEA-Research/grounding-dino-tiny
  prompt: "person."
  scale: 1.0
  floor: 0.05
  adapter: null

operating_point:
  method: crc-frame
  target: 0.90            # 0.80 or 0.90 (alpha = 1 - target)
  nms: 0.3                # null = plain Phase 3 baseline (no NMS)
  calibration_nms: results/metrics/conformal-nms.json        # used when nms is set
  calibration_plain: results/metrics/conformal-baseline.json # used when nms is null

input:                    # ordered frames from a manifest (labels optional), or a plain folder
  manifest: data/manifests/sard/test.json
  data_root: data/raw/sard-roboflow-tiles
  blocks: ["1321-1360", "481-520", "281-320"]   # frame ranges, replayed in this order; 281-320 = easy block
  folder: null            # alternative: folder of images, replayed in sorted filename order, no labels

consistency_cache: results/baseline-test/cache/person_s1.json   # compare kept detections with the Phase 3 cache; null to skip
save_annotated: true
