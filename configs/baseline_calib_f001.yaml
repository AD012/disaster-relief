# Frozen zero-shot baseline on the SARD calibration split (for Phase 5 conformal).
# baseline.py caches raw detections per (prompt, scale); evaluate.py scores the cache.
run_name: baseline-calib-f001
seed: 0

model: IDEA-Research/grounding-dino-tiny
data_root: data/raw/sard-roboflow-tiles
manifests: data/manifests/sard
split: calib
subset: null        # number of tiles sampled from the split; null = all

prompts: ["person."]
scales: [1.0]

cache_threshold: 0.01   # lower floor for Phase 3 high-recall calibration; frozen settings unchanged
text_threshold: 0.05
sweep_thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.6]
